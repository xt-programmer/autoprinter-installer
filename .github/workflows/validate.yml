name: Validate installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: sh -n run.sh && sh -n install.sh
      - run: python autoprinter.py --inventory
      - run: python config_sync.py --printer-profile manual-z
  published-command:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Download and run published inventory command
        run: curl --proto '=https' --proto-redir '=https' -fsSL https://raw.githubusercontent.com/xt-programmer/autoprinter-installer/v0.8.0/install.sh | sh -s -- --inventory
      - name: Download and plan bundled Cartographer configs without writing
        run: curl --proto '=https' --proto-redir '=https' -fsSL https://raw.githubusercontent.com/xt-programmer/autoprinter-installer/v0.8.0/install.sh | sh -s -- --configs --printer-profile cartographer
      - name: Verify the published temporary console helper
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL -o console-launch.py https://github.com/xt-programmer/autoprinter-installer/releases/download/v0.8.0/console-launch.py
          curl --proto '=https' --proto-redir '=https' -fsSL -o console-launch.py.sha256 https://github.com/xt-programmer/autoprinter-installer/releases/download/v0.8.0/console-launch.py.sha256
          sha256sum --check console-launch.py.sha256
          python -m py_compile console-launch.py
      - name: Verify published update entrypoint help without a board or writes
        run: curl --proto '=https' --proto-redir '=https' -fsSL https://raw.githubusercontent.com/xt-programmer/autoprinter-installer/v0.8.0/install.sh | sh -s -- --klipper-update-only -- --help
