## Settings 500P  ##
## Version:  5.6  ##
## 05-11-2026 AB  ##

################################
####         General        ####
################################
[gcode_arcs]
[exclude_object]
[pause_resume]
recover_velocity: 50.0
[respond]
[display_status]
[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT PARK=0
[force_move]
enable_force_move: True
[idle_timeout]
timeout: 20420
gcode:
    TURN_OFF_HEATERS
    {% if printer.pause_resume.is_paused %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=True
    {% endif %}

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 6200
max_z_velocity: 15
max_z_accel: 50
square_corner_velocity: 4

################################
####         Gantry         ####
################################
[stepper_x]
microsteps: 16
position_endstop: 0
position_min: -1
position_max: 500
homing_speed: 100

[stepper_y]
microsteps: 16
position_endstop: 0
position_min: -1
position_max: 500
homing_speed: 100

[stepper_x1]
microsteps: 16

[stepper_y1]
microsteps: 16

################################
####         Z-Lift         ####
################################
[stepper_z]
microsteps: 32
position_max: 1150
position_min: -10
homing_speed: 15
second_homing_speed: 3

[stepper_z1]
microsteps: 32

################################
####   Heating & Extruding  ####
################################
[extruder]
nozzle_diameter: 1.0
microsteps: 16
pressure_advance: 0.02
max_extrude_only_distance: 150.0
max_extrude_cross_section: 10
min_extrude_temp: 170
min_temp: 5
max_temp: 320
smooth_time: 5.0

[heater_bed]
min_temp: 10
max_temp: 100

[filament_motion_sensor filament_movement]
pause_on_runout: True
runout_gcode:
    LED_runout
extruder: extruder
event_delay: 5.0
pause_delay: 1.0
detection_length: 25

[filament_switch_sensor filament_present]
pause_on_runout: True
runout_gcode:
    LED_runout

#################################
##     Fan's & Temperature     ##
#################################
[fan]
kick_start_time: 0.5

[temperature_sensor Octopus]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

################################
####          LEDS          ####
################################
[led my_led]
initial_RED: 0.2
initial_GREEN: 0.3
initial_BLUE: 0.2

################################
####     Stepper Drivers    ####
################################
[tmc5160 stepper_x]
interpolate: False
run_current: 1.6
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_x1]
interpolate: False
run_current: 1.6
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_y]
interpolate: False
run_current: 1.6
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_y1]
interpolate: False
run_current: 1.6
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z]
interpolate: False
run_current: 1.5
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z1]
interpolate: False
run_current: 1.5
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 extruder]
interpolate: False
run_current: 0.65
sense_resistor: 0.075
stealthchop_threshold: 0
