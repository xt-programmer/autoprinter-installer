## Macro    500P  ##
## Version:  5.6  ##
## 05-11-2026 AB  ##

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True
variable_custom_park_x: 6.0
variable_custom_park_y: 6.0
variable_custom_park_dz: 2.0
variable_retract: 1.0
variable_unretract: 1.0
variable_speed_retract: 35.0
variable_speed_unretract: 20.0
variable_speed_hop: 15.0
variable_speed_move: 50.0
variable_idle_timeout: 43200
variable_runout_sensor: "filament_switch_sensor filament_present"
gcode:

[gcode_macro PRINT_START]
description: Start with the existing heating, homing and purge sequence
gcode:
  {% set bed = params.BED|default(80)|float(-9999) %}
  {% set hotend = params.HOTEND|default(250)|float(-9999) %}
  {% set cfg = printer.configfile.settings %}
  {% if printer.pause_resume.is_paused %}
    {action_raise_error("A print is paused; resume or cancel it before PRINT_START")}
  {% elif not (bed == 0 or cfg.heater_bed.min_temp <= bed <= cfg.heater_bed.max_temp) %}
    {action_raise_error("Invalid BED temperature")}
  {% elif not (cfg.extruder.min_extrude_temp <= hotend <= cfg.extruder.max_temp) %}
    {action_raise_error("Invalid HOTEND temperature for printing")}
  {% elif not printer['filament_switch_sensor filament_present'].filament_detected %}
    {action_raise_error("Load filament before starting the print")}
  {% else %}
    _RESET_RECOVERY_500
    SET_FILAMENT_SENSOR SENSOR=filament_movement ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=filament_present ENABLE=0
    LED_printing
    M220 S100
    M140 S{bed}
    M190 S{bed}
    G92 E0
    G28
    M104 S{hotend}
    M109 S{hotend}
    G28 Z
    PURGE_BLOB
    G92 E0
    M220 S90
    SET_FILAMENT_SENSOR SENSOR=filament_present ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=filament_movement ENABLE=0
  {% endif %}

[gcode_macro PAUSE]
description: Capture a printing pause once, retract once and park safely
rename_existing: PAUSE_BASE
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
  {% set file = printer.virtual_sdcard.file_path %}
  {% if printer.pause_resume.is_paused %}
    RESPOND TYPE=echo MSG="Already paused; saved temperatures and position retained"
  {% elif not file or printer.print_stats.state not in ['printing', 'paused'] %}
    RESPOND TYPE=error MSG="No running file to pause"
  {% else %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': params.RESTORE|default(1)|int == 1, 'temp': printer.extruder.target}}"
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_bed_temp VALUE={printer.heater_bed.target}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_file VALUE='{file|tojson}'
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_retracted VALUE=False
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% if client.idle_timeout|float > 0 %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.idle_timeout.idle_timeout|default(printer.configfile.settings.idle_timeout.timeout)|float}
      SET_IDLE_TIMEOUT TIMEOUT={client.idle_timeout|float}
    {% endif %}
    PAUSE_BASE
    LED_pause
    _PAUSE_PARK_500 {rawparams}
  {% endif %}

[gcode_macro _PAUSE_PARK_500]
gcode:
  {% set recovery = printer['gcode_macro RESUME'] %}
  {% if printer.pause_resume.is_paused and recovery.pause_file == printer.virtual_sdcard.file_path %}
    {% if printer.extruder.can_extrude and 'xyz' in printer.toolhead.homed_axes %}
      _CLIENT_RETRACT
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_retracted VALUE=True
    {% endif %}
    _PARK_500 DZ={printer['gcode_macro _CLIENT_VARIABLE'].custom_park_dz} X={params.X|default(printer['gcode_macro _CLIENT_VARIABLE'].custom_park_x)} Y={params.Y|default(printer['gcode_macro _CLIENT_VARIABLE'].custom_park_y)} Z_MIN={params.Z_MIN|default(0)}
  {% endif %}
  M400
  M104 S0

[gcode_macro RESUME]
description: Validate a real pause, restore temperatures, then recheck before moving
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_last_bed_temp: 0
variable_restore_idle_timeout: 0
variable_idle_state: False
variable_pause_file: ""
variable_pause_retracted: False
gcode:
  {% set sensor = printer['filament_switch_sensor filament_present'] %}
  {% set cfg = printer.configfile.settings %}
  {% set velocity = params.VELOCITY|default(cfg.pause_resume.recover_velocity)|float(-1) %}
  {% if not printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="No paused print to resume"
  {% elif not pause_file or pause_file != printer.virtual_sdcard.file_path or printer.print_stats.state != 'paused' %}
    RESPOND TYPE=error MSG="Paused file changed or recovery state is missing; cancel this job"
  {% elif 'xyz' not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG="Resume blocked: position was lost; do not home over the part"
  {% elif sensor.enabled and not sensor.filament_detected %}
    RESPOND TYPE=error MSG="Resume blocked: load filament first"
  {% elif not (0 < velocity <= cfg.printer.max_velocity) %}
    RESPOND TYPE=error MSG="Invalid RESUME velocity"
  {% elif last_extruder_temp.restore and not (cfg.extruder.min_extrude_temp <= last_extruder_temp.temp|float <= cfg.extruder.max_temp) %}
    RESPOND TYPE=error MSG="Resume blocked: saved nozzle target is unsuitable; cancel rather than guessing a printing temperature"
  {% elif not last_extruder_temp.restore and (not printer.extruder.can_extrude or printer.extruder.target < cfg.extruder.min_extrude_temp or printer.extruder.temperature < printer.extruder.target - 2.0) %}
    RESPOND TYPE=error MSG="Resume blocked: heat the nozzle to a suitable printing temperature"
  {% elif not (last_bed_temp|float == 0 or cfg.heater_bed.min_temp <= last_bed_temp|float <= cfg.heater_bed.max_temp) %}
    RESPOND TYPE=error MSG="Resume blocked: saved bed target is invalid"
  {% else %}
    {% if last_bed_temp|float > 0 %} M140 S{last_bed_temp} {% endif %}
    {% if last_extruder_temp.restore %} M104 S{last_extruder_temp.temp} {% endif %}
    {% if last_bed_temp|float > 0 %} M190 S{last_bed_temp} {% endif %}
    {% if last_extruder_temp.restore %} M109 S{last_extruder_temp.temp} {% endif %}
    _RESUME_READY_500 VELOCITY={velocity}
  {% endif %}

[gcode_macro _RESUME_READY_500]
description: Fresh checks after the temperature waits
gcode:
  {% set recovery = printer['gcode_macro RESUME'] %}
  {% set sensor = printer['filament_switch_sensor filament_present'] %}
  {% set cfg = printer.configfile.settings %}
  {% set velocity = params.VELOCITY|default(cfg.pause_resume.recover_velocity)|float(-1) %}
  {% if not printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="Resume stopped: pause state changed"
  {% elif not recovery.pause_file or recovery.pause_file != printer.virtual_sdcard.file_path or printer.print_stats.state != 'paused' %}
    RESPOND TYPE=error MSG="Resume stopped: paused file changed"
  {% elif 'xyz' not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG="Resume stopped: position was lost"
  {% elif sensor.enabled and not sensor.filament_detected %}
    RESPOND TYPE=error MSG="Resume stopped: no filament detected"
  {% elif not printer.extruder.can_extrude or printer.extruder.target < cfg.extruder.min_extrude_temp %}
    RESPOND TYPE=error MSG="Resume stopped: nozzle is not ready"
  {% elif printer.extruder.temperature < printer.extruder.target - 2.0 or (recovery.last_extruder_temp.restore and printer.extruder.target != recovery.last_extruder_temp.temp|float) %}
    RESPOND TYPE=error MSG="Resume stopped: nozzle target changed or nozzle is below its target"
  {% elif recovery.last_bed_temp|float > 0 and (printer.heater_bed.target != recovery.last_bed_temp|float or printer.heater_bed.temperature < recovery.last_bed_temp|float - 2.0) %}
    RESPOND TYPE=error MSG="Resume stopped: bed is not ready"
  {% elif not (0 < velocity <= cfg.printer.max_velocity) %}
    RESPOND TYPE=error MSG="Resume stopped: invalid velocity"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if recovery.pause_retracted %}
      _CLIENT_EXTRUDE LENGTH={printer['gcode_macro _CLIENT_VARIABLE'].unretract}
    {% endif %}
    RESUME_BASE VELOCITY={velocity}
    _RESET_RECOVERY_500 LAYERS=0
    LED_printing
  {% endif %}

[gcode_macro PRINT_END]
description: Shut down and park at the end of the print
gcode:
  {% set file = printer.virtual_sdcard.file_path %}
  {% if not file or printer.print_stats.state != 'printing' or printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="PRINT_END requires a running file"
  {% else %}
    TURN_OFF_HEATERS
    M106 S0
    SET_FILAMENT_SENSOR SENSOR=filament_movement ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=filament_present ENABLE=0
    _RESET_RECOVERY_500
    M400
    _PARK_500 DZ=200
    M400
    M84
    LED_print_done
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel a print; use PARK=0 to skip movement
rename_existing: CANCEL_PRINT_BASE
gcode:
  {% set active = printer.print_stats.state in ['printing', 'paused'] and printer.virtual_sdcard.file_path %}
  TURN_OFF_HEATERS
  M106 S0
  SET_FILAMENT_SENSOR SENSOR=filament_movement ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=filament_present ENABLE=0
  CANCEL_PRINT_BASE
  RESPOND TYPE=command MSG="action:prompt_end"
  _RESET_RECOVERY_500
  LED_error
  {% if active and params.PARK|default(1)|int == 1 %}
    _PARK_500 DZ=100 PARK_XY=0
    M400
    M84
  {% endif %}

[gcode_macro _RESET_RECOVERY_500]
gcode:
  {% set recovery = printer['gcode_macro RESUME'] %}
  {% if recovery.restore_idle_timeout|float > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={recovery.restore_idle_timeout}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': False, 'temp': 0}}"
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_bed_temp VALUE=0
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE=0
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_file VALUE='""'
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_retracted VALUE=False
  {% if params.LAYERS|default(1)|int == 1 %}
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  {% endif %}

[gcode_macro _PARK_500]
description: CoreXY clearance first, with bounded Z travel and explicit speeds
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
  {% set axes = printer.toolhead.homed_axes %}
  {% set xy = params.PARK_XY|default(1)|int == 1 %}
  {% set pos = printer.gcode_move.position %}
  {% set gc = printer.gcode_move.gcode_position %}
  {% set minimum = printer.toolhead.axis_minimum %}
  {% set maximum = printer.toolhead.axis_maximum %}
  {% set dz = params.DZ|default(client.custom_park_dz)|float(-1) %}
  {% set z_min = params.Z_MIN|default(0)|float(-9999) %}
  {% set x = params.X|default(client.custom_park_x)|float(-9999) %}
  {% set y = params.Y|default(client.custom_park_y)|float(-9999) %}
  {% set ox = pos.x - gc.x %}
  {% set oy = pos.y - gc.y %}
  {% set oz = pos.z - gc.z %}
  {% set z_ceiling = maximum.z - 0.5 %}
  {% set target = [[pos.z + dz, z_min + oz]|max, z_ceiling]|min %}
  {% set clear = [target, pos.z + client.custom_park_dz|float]|min %}
  {% if 'z' not in axes or (xy and 'xyz' not in axes) %}
    RESPOND TYPE=echo MSG="Park skipped: required axes are not homed"
  {% elif not (0 <= dz <= maximum.z - minimum.z) or not (-9998 < z_min < 9998) %}
    RESPOND TYPE=error MSG="Park skipped: invalid clearance parameter"
  {% elif not (minimum.z <= pos.z <= maximum.z) %}
    RESPOND TYPE=error MSG="Park skipped: Z position is outside travel limits"
  {% elif xy and not (minimum.x <= x + ox <= maximum.x and minimum.y <= y + oy <= maximum.y) %}
    RESPOND TYPE=error MSG="Park skipped: XY destination is outside travel limits"
  {% else %}
    SAVE_GCODE_STATE NAME=PARK_500_STATE
    G90
    {% if clear > pos.z %} G1 Z{clear - oz} F{client.speed_hop|float * 60} {% endif %}
    {% if xy %}
      {% if clear - pos.z >= client.custom_park_dz|float - 0.001 %}
        G1 X{x} Y{y} F{client.speed_move|float * 60}
      {% else %}
        RESPOND TYPE=echo MSG="XY park skipped: insufficient Z clearance near the upper limit"
      {% endif %}
    {% endif %}
    {% if target > clear and target > pos.z %} G1 Z{target - oz} F{client.speed_hop|float * 60} {% endif %}
    RESTORE_GCODE_STATE NAME=PARK_500_STATE
  {% endif %}

[gcode_macro PURGE_BLOB]
description: Original purge amounts; explicit extrusion mode and preserved parser state
gcode:
  {% set pos = printer.gcode_move.position %}
  {% set gc = printer.gcode_move.gcode_position %}
  {% set minimum = printer.toolhead.axis_minimum %}
  {% set maximum = printer.toolhead.axis_maximum %}
  {% set ox = pos.x - gc.x %}
  {% set oy = pos.y - gc.y %}
  {% set oz = pos.z - gc.z %}
  {% set fan = printer.fan.speed %}
  {% if printer.pause_resume.is_paused %}
    {action_raise_error("PURGE_BLOB is for startup on a clear bed; it cannot run during a pause")}
  {% elif 'xyz' not in printer.toolhead.homed_axes or not printer.extruder.can_extrude %}
    {action_raise_error("Home the printer and heat the nozzle before purging")}
  {% elif not printer['filament_switch_sensor filament_present'].filament_detected %}
    {action_raise_error("No filament detected before purge")}
  {% elif not (minimum.x <= 20 + ox and 80 + ox <= maximum.x and minimum.y <= 20 + oy and 80 + oy <= maximum.y and minimum.z <= 5 + oz and 8 + oz <= maximum.z) %}
    {action_raise_error("Purge path is outside travel limits")}
  {% else %}
    SAVE_GCODE_STATE NAME=PURGE_BLOB_STATE
    G90
    M83
    M221 S100
    G1 X20 Y20 Z8 F18000
    G1 Z5 F600
    G1 E140 F900
    M106 S255
    G1 E15 F450
    G1 E-2 F3000
    G1 X80 Y80 F18000
    M106 S{fan * 255}
    RESTORE_GCODE_STATE NAME=PURGE_BLOB_STATE
  {% endif %}

[gcode_macro PRIME_FILAMENT]
description: Optional manual prime after a filament change; example PRIME_FILAMENT LENGTH=50
gcode:
  {% set recovery = printer['gcode_macro RESUME'] %}
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
  {% set gc = printer.gcode_move.gcode_position %}
  {% set length = params.LENGTH|default(50)|float(-1) %}
  {% set speed = params.SPEED|default(5)|float(-1) %}
  {% if not printer.pause_resume.is_paused or not recovery.pause_file or recovery.pause_file != printer.virtual_sdcard.file_path or printer.print_stats.state != 'paused' %}
    {action_raise_error("PRIME_FILAMENT requires an ordinary printing pause")}
  {% elif 'xyz' not in printer.toolhead.homed_axes or not printer.extruder.can_extrude or not printer['filament_switch_sensor filament_present'].filament_detected %}
    {action_raise_error("Home position, hot nozzle and loaded filament are required for priming")}
  {% elif (gc.x - client.custom_park_x)|abs > 0.5 or (gc.y - client.custom_park_y)|abs > 0.5 %}
    {action_raise_error("Prime only at the configured park position, with space to collect the filament")}
  {% elif not (0 < length <= 140 and 0 < speed <= 20) %}
    {action_raise_error("Prime requires LENGTH in (0,140] mm and SPEED in (0,20] mm/s")}
  {% else %}
    SAVE_GCODE_STATE NAME=PRIME_FILAMENT_STATE
    M83
    M221 S100
    G1 E{length} F{speed * 60}
    RESTORE_GCODE_STATE NAME=PRIME_FILAMENT_STATE
  {% endif %}

[gcode_macro LED_printing]
gcode:
  SET_LED LED=my_led RED=0.2 GREEN=0.3 BLUE=0.2 SYNC=0 TRANSMIT=1

[gcode_macro LED_print_done]
gcode:
  SET_LED LED=my_led RED=0 GREEN=0.2 BLUE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_idle]
gcode:
  SET_LED LED=my_led RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_error]
gcode:
  SET_LED LED=my_led RED=0.2 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_pause]
gcode:
  SET_LED LED=my_led RED=0.2 GREEN=0.1 BLUE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_runout]
description: Four flashes followed by steady illumination; original colors retained
gcode:
  {% for pulse in range(4) %}
    SET_LED LED=my_led RED=0 GREEN=0 BLUE=0 SYNC=1 TRANSMIT=1
    G4 P250
    SET_LED LED=my_led RED=0.2 GREEN=0.1 BLUE=0 SYNC=1 TRANSMIT=1
    G4 P250
  {% endfor %}
  SET_LED LED=my_led RED=0 GREEN=0 BLUE=0 SYNC=1 TRANSMIT=1
  G4 P250
  SET_LED LED=my_led RED=0.2 GREEN=0.1 BLUE=0 SYNC=1 TRANSMIT=1
  M400
