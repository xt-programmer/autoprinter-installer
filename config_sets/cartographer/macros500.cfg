## Macro    500P  ##
## Version:  6.5  ##
## 10-11-2026 AB  ##

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True
variable_custom_park_x: 6.0
variable_custom_park_y: 6.0
variable_custom_park_dz: 2.0
variable_retract: 1.0
variable_unretract: 1.0
variable_speed_retract: 35.0
variable_speed_unretract: 20.0
variable_speed_hop: 15.0
variable_speed_move: 50.0
variable_idle_timeout: 43200
variable_runout_sensor: "filament_switch_sensor filament_present"
gcode:

[gcode_macro _PRINT_STATE_500]
variable_postprint_pending: False
variable_pending_file: ""
gcode:

[gcode_macro PRINT_START]
description: Permanent Cartographer start; BED/HOTEND/SOAK/ADAPTIVE/MESH_RUNS/NOZZLE
gcode:
  {% set state = printer['gcode_macro _PRINT_STATE_500'] %}
  {% set cfg = printer.configfile.settings %}
  {% set bed = params.BED|default(80)|float(-9999) %}
  {% set hotend = params.HOTEND|default(250)|float(-9999) %}
  {% set soak = params.SOAK|default(300)|float(-1) %}
  {% set adaptive = params.ADAPTIVE|default(0)|int(-1) %}
  {% set runs = params.MESH_RUNS|default(2)|int(-1) %}
  {% set nozzle = params.NOZZLE|default(cfg.extruder.nozzle_diameter)|float(-1) %}
  {% set purge_length = params.PURGE_LENGTH|default(140)|float(-1) %}
  {% set purge_speed = params.PURGE_SPEED|default(15)|float(-1) %}
  {% if state.postprint_pending %}
    {action_raise_error("Resolve the previous final Yes/No check before starting another job")}
  {% elif printer.pause_resume.is_paused %}
    {action_raise_error("A print is paused; resume or cancel it before PRINT_START")}
  {% elif not (bed == 0 or cfg.heater_bed.min_temp <= bed <= cfg.heater_bed.max_temp) %}
    {action_raise_error("Invalid BED temperature")}
  {% elif not (cfg.extruder.min_extrude_temp <= hotend <= cfg.extruder.max_temp) %}
    {action_raise_error("Invalid HOTEND temperature for printing")}
  {% elif not (0 <= soak <= 3600 and adaptive in [0, 1] and 1 <= runs <= 4) %}
    {action_raise_error("Use SOAK=0..3600 seconds, ADAPTIVE=0/1, MESH_RUNS=1..4")}
  {% elif not (0.8 <= nozzle <= 1.2 and (nozzle - cfg.extruder.nozzle_diameter)|abs < 0.001) %}
    {action_raise_error("NOZZLE must match the fitted 0.8..1.2 mm nozzle in nozzle.cfg")}
  {% elif not (0 < purge_length <= 140 and 0 < purge_speed <= 15) %}
    {action_raise_error("Use PURGE_LENGTH in (0,140] mm and PURGE_SPEED in (0,15] mm/s")}
  {% elif adaptive == 1 and not printer.exclude_object.objects %}
    {action_raise_error("Adaptive mesh needs EXCLUDE_OBJECT_DEFINE metadata before PRINT_START; otherwise use ADAPTIVE=0")}
  {% elif not printer['filament_switch_sensor filament_present'].filament_detected %}
    {action_raise_error("Load filament before starting the print")}
  {% else %}
    _RESET_RECOVERY_500
    SET_FILAMENT_SENSOR SENSOR=filament_movement ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=filament_present ENABLE=0
    LED_printing
    M220 S100
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0 MOVE=0
    # 140C gives headroom below the Touch 150C limit, including hot restarts.
    M104 S140
    M140 S{bed}
    G90
    G92 E0
    G28
    {% if bed > 0 %}
      M190 S{bed}
      {% if soak > 0 %}
        RESPOND TYPE=echo MSG="Bed heat soak: {soak|int} seconds"
        G4 P{(soak * 1000)|int}
      {% endif %}
    {% endif %}
    M109 S140
    _START_GEOMETRY_500 BED={bed} HOTEND={hotend} ADAPTIVE={adaptive} RUNS={runs} PURGE_LENGTH={purge_length} PURGE_SPEED={purge_speed}
  {% endif %}

[gcode_macro _START_GEOMETRY_500]
description: Fresh nozzle/bed/filament checks before tilt and Touch
gcode:
  {% set bed = params.BED|float %}
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    {action_raise_error("Startup stopped: home position was lost")}
  {% elif printer.extruder.target != 140 or not (138 <= printer.extruder.temperature <= 145) %}
    {action_raise_error("Startup stopped: nozzle must settle at 140C before Touch")}
  {% elif printer.heater_bed.target != bed or (bed > 0 and printer.heater_bed.temperature < bed - 2) %}
    {action_raise_error("Startup stopped: bed target changed or bed cooled")}
  {% elif not printer['filament_switch_sensor filament_present'].filament_detected %}
    {action_raise_error("Startup stopped: no filament detected")}
  {% else %}
    Z_TILT_ADJUST
    # Touch establishes final Z after tilt; a second scan G28 Z is redundant.
    CARTOGRAPHER_TOUCH_HOME
    BED_MESH_CALIBRATE METHOD=scan ADAPTIVE={params.ADAPTIVE} RUNS={params.RUNS}
    M104 S{params.HOTEND}
    M109 S{params.HOTEND}
    _START_FINISH_500 BED={bed} HOTEND={params.HOTEND} PURGE_LENGTH={params.PURGE_LENGTH} PURGE_SPEED={params.PURGE_SPEED}
  {% endif %}

[gcode_macro _START_FINISH_500]
description: Recheck after heating, purge, then arm both filament sensors
gcode:
  {% set bed = params.BED|float %}
  {% set hotend = params.HOTEND|float %}
  {% if 'xyz' not in printer.toolhead.homed_axes or not printer.extruder.can_extrude %}
    {action_raise_error("Startup stopped: homing or extrusion readiness was lost")}
  {% elif printer.extruder.target != hotend or printer.extruder.temperature < hotend - 2 %}
    {action_raise_error("Startup stopped: nozzle target changed or nozzle cooled")}
  {% elif printer.heater_bed.target != bed or (bed > 0 and printer.heater_bed.temperature < bed - 2) %}
    {action_raise_error("Startup stopped: bed target changed or bed cooled")}
  {% elif not printer['filament_switch_sensor filament_present'].filament_detected %}
    {action_raise_error("Startup stopped: no filament detected before purge")}
  {% else %}
    PURGE_BLOB LENGTH={params.PURGE_LENGTH} SPEED={params.PURGE_SPEED}
    G92 E0
    M220 S100
    SET_FILAMENT_SENSOR SENSOR=filament_present ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=filament_movement ENABLE=1
  {% endif %}

[gcode_macro PAUSE]
description: Capture a printing pause once, retract once and park safely
rename_existing: PAUSE_BASE
gcode:
  {% set state = printer['gcode_macro _PRINT_STATE_500'] %}
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
  {% set file = printer.virtual_sdcard.file_path %}
  {% if state.postprint_pending %}
    SHOW_POSTPRINT_PROMPT
  {% elif printer.pause_resume.is_paused %}
    RESPOND TYPE=echo MSG="Already paused; saved temperatures and position retained"
  {% elif not file or printer.print_stats.state not in ['printing', 'paused'] %}
    RESPOND TYPE=error MSG="No running file to pause"
  {% else %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': params.RESTORE|default(1)|int == 1, 'temp': printer.extruder.target}}"
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_bed_temp VALUE={printer.heater_bed.target}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_file VALUE='{file|tojson}'
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_retracted VALUE=False
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_cooldown_ack VALUE=False
    {% if client.idle_timeout|float > 0 %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.idle_timeout.idle_timeout|default(printer.configfile.settings.idle_timeout.timeout)|float}
      SET_IDLE_TIMEOUT TIMEOUT={client.idle_timeout|float}
    {% endif %}
    PAUSE_BASE
    LED_pause
    _PAUSE_PARK_500 {rawparams}
  {% endif %}

[gcode_macro _PAUSE_PARK_500]
gcode:
  {% set recovery = printer['gcode_macro RESUME'] %}
  {% if printer.pause_resume.is_paused and recovery.pause_file == printer.virtual_sdcard.file_path and not printer['gcode_macro _PRINT_STATE_500'].postprint_pending %}
    {% if printer.extruder.can_extrude and 'xyz' in printer.toolhead.homed_axes %}
      _CLIENT_RETRACT
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_retracted VALUE=True
    {% endif %}
    _PARK_500 DZ={printer['gcode_macro _CLIENT_VARIABLE'].custom_park_dz} X={params.X|default(printer['gcode_macro _CLIENT_VARIABLE'].custom_park_x)} Y={params.Y|default(printer['gcode_macro _CLIENT_VARIABLE'].custom_park_y)} Z_MIN={params.Z_MIN|default(0)}
  {% endif %}
  M400
  M104 S0

[gcode_macro RESUME]
description: Validate a real pause, restore temperatures, then recheck before moving
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_last_bed_temp: 0
variable_restore_idle_timeout: 0
variable_idle_state: False
variable_bed_cooldown_ack: False
variable_pause_file: ""
variable_pause_retracted: False
gcode:
  {% set state = printer['gcode_macro _PRINT_STATE_500'] %}
  {% set sensor = printer['filament_switch_sensor filament_present'] %}
  {% set cfg = printer.configfile.settings %}
  {% set velocity = params.VELOCITY|default(cfg.pause_resume.recover_velocity)|float(-1) %}
  {% if state.postprint_pending %}
    SHOW_POSTPRINT_PROMPT
  {% elif not printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="No paused print to resume"
  {% elif not pause_file or pause_file != printer.virtual_sdcard.file_path or printer.print_stats.state != 'paused' %}
    RESPOND TYPE=error MSG="Paused file changed or recovery state is missing; cancel this job"
  {% elif 'xyz' not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG="Resume blocked: position was lost; do not home over the part"
  {% elif sensor.enabled and not sensor.filament_detected %}
    RESPOND TYPE=error MSG="Resume blocked: load filament first"
  {% elif last_bed_temp|float > 0 and (idle_state or printer.heater_bed.target < last_bed_temp|float - 5 or printer.heater_bed.temperature < last_bed_temp|float - 5) and not bed_cooldown_ack and params.ACK_BED_COOLDOWN|default(0)|int != 1 %}
    RESPOND TYPE=error MSG="Bed cooled or timed out: inspect part adhesion; RESUME ACK_BED_COOLDOWN=1 only after inspection"
  {% elif not (0 < velocity <= cfg.printer.max_velocity) %}
    RESPOND TYPE=error MSG="Invalid RESUME velocity"
  {% elif last_extruder_temp.restore and not (cfg.extruder.min_extrude_temp <= last_extruder_temp.temp|float <= cfg.extruder.max_temp) %}
    RESPOND TYPE=error MSG="Resume blocked: saved nozzle target is unsuitable; cancel rather than guessing a printing temperature"
  {% elif not last_extruder_temp.restore and (not printer.extruder.can_extrude or printer.extruder.target < cfg.extruder.min_extrude_temp or printer.extruder.temperature < printer.extruder.target - 2.0) %}
    RESPOND TYPE=error MSG="Resume blocked: heat the nozzle to a suitable printing temperature"
  {% elif not (last_bed_temp|float == 0 or cfg.heater_bed.min_temp <= last_bed_temp|float <= cfg.heater_bed.max_temp) %}
    RESPOND TYPE=error MSG="Resume blocked: saved bed target is invalid"
  {% else %}
    {% if params.ACK_BED_COOLDOWN|default(0)|int == 1 %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_cooldown_ack VALUE=True
    {% endif %}
    {% if last_bed_temp|float > 0 %} M140 S{last_bed_temp} {% endif %}
    {% if last_extruder_temp.restore %} M104 S{last_extruder_temp.temp} {% endif %}
    {% if last_bed_temp|float > 0 %} M190 S{last_bed_temp} {% endif %}
    {% if last_extruder_temp.restore %} M109 S{last_extruder_temp.temp} {% endif %}
    _RESUME_READY_500 VELOCITY={velocity}
  {% endif %}

[gcode_macro _RESUME_READY_500]
description: Fresh checks after the temperature waits
gcode:
  {% set recovery = printer['gcode_macro RESUME'] %}
  {% set sensor = printer['filament_switch_sensor filament_present'] %}
  {% set cfg = printer.configfile.settings %}
  {% set velocity = params.VELOCITY|default(cfg.pause_resume.recover_velocity)|float(-1) %}
  {% if printer['gcode_macro _PRINT_STATE_500'].postprint_pending or not printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="Resume stopped: pause state changed"
  {% elif recovery.last_bed_temp|float > 0 and recovery.idle_state and not recovery.bed_cooldown_ack %}
    RESPOND TYPE=error MSG="Resume stopped: bed timed out during recovery; inspect adhesion before acknowledging"
  {% elif not recovery.pause_file or recovery.pause_file != printer.virtual_sdcard.file_path or printer.print_stats.state != 'paused' %}
    RESPOND TYPE=error MSG="Resume stopped: paused file changed"
  {% elif 'xyz' not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG="Resume stopped: position was lost"
  {% elif sensor.enabled and not sensor.filament_detected %}
    RESPOND TYPE=error MSG="Resume stopped: no filament detected"
  {% elif not printer.extruder.can_extrude or printer.extruder.target < cfg.extruder.min_extrude_temp %}
    RESPOND TYPE=error MSG="Resume stopped: nozzle is not ready"
  {% elif printer.extruder.temperature < printer.extruder.target - 2.0 or (recovery.last_extruder_temp.restore and printer.extruder.target != recovery.last_extruder_temp.temp|float) %}
    RESPOND TYPE=error MSG="Resume stopped: nozzle target changed or nozzle is below its target"
  {% elif recovery.last_bed_temp|float > 0 and (printer.heater_bed.target != recovery.last_bed_temp|float or printer.heater_bed.temperature < recovery.last_bed_temp|float - 2.0) %}
    RESPOND TYPE=error MSG="Resume stopped: bed is not ready"
  {% elif not (0 < velocity <= cfg.printer.max_velocity) %}
    RESPOND TYPE=error MSG="Resume stopped: invalid velocity"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if recovery.pause_retracted %}
      _CLIENT_EXTRUDE LENGTH={printer['gcode_macro _CLIENT_VARIABLE'].unretract}
    {% endif %}
    RESUME_BASE VELOCITY={velocity}
    _RESET_RECOVERY_500 CLEAR_END=0 LAYERS=0
    LED_printing
  {% endif %}

[gcode_macro PRINT_END]
description: Park and shut down, then hold the file for the final Yes/No decision
gcode:
  {% set state = printer['gcode_macro _PRINT_STATE_500'] %}
  {% set file = printer.virtual_sdcard.file_path %}
  {% if state.postprint_pending %}
    SHOW_POSTPRINT_PROMPT
  {% elif not file or printer.print_stats.state != 'printing' or printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="PRINT_END requires a running file; no final check was started"
  {% else %}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE_500 VARIABLE=postprint_pending VALUE=True
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE_500 VARIABLE=pending_file VALUE='{file|tojson}'
    PAUSE_BASE
    TURN_OFF_HEATERS
    M106 S0
    SET_FILAMENT_SENSOR SENSOR=filament_movement ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=filament_present ENABLE=0
    _RESET_RECOVERY_500 CLEAR_END=0
    M400
    _PARK_500 DZ=200
    M400
    M84
    LED_pause
    SHOW_POSTPRINT_PROMPT
  {% endif %}

[gcode_macro SHOW_POSTPRINT_PROMPT]
description: Show or redisplay the pending final Yes/No check
gcode:
  {% set state = printer['gcode_macro _PRINT_STATE_500'] %}
  {% if state.postprint_pending and state.pending_file and state.pending_file == printer.virtual_sdcard.file_path and printer.pause_resume.is_paused and printer.print_stats.state in ['printing', 'paused'] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Post-print check"
    RESPOND TYPE=command MSG="action:prompt_text Is the final part printed to your satisfaction?"
    RESPOND TYPE=command MSG="action:prompt_footer_button Yes - accept|FINISH_PRINT|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button No - cancel|CANCEL_CLOSE_PROMPT|error"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    RESPOND TYPE=error MSG="No matching final check is pending"
  {% endif %}

[gcode_macro FINISH_PRINT]
description: Accept the pending finished part without heating or moving
gcode:
  {% set state = printer['gcode_macro _PRINT_STATE_500'] %}
  {% if state.postprint_pending and state.pending_file and state.pending_file == printer.virtual_sdcard.file_path and printer.pause_resume.is_paused and printer.print_stats.state == 'paused' and not printer.virtual_sdcard.is_active %}
    RESPOND TYPE=command MSG="action:prompt_end"
    TURN_OFF_HEATERS
    M106 S0
    _RESET_RECOVERY_500
    CLEAR_PAUSE
    LED_print_done
    M24
  {% else %}
    RESPOND TYPE=error MSG="Accept ignored: no matching paused final check"
  {% endif %}

[gcode_macro CANCEL_CLOSE_PROMPT]
description: Reject only the matching pending final check
gcode:
  {% set state = printer['gcode_macro _PRINT_STATE_500'] %}
  {% if state.postprint_pending and state.pending_file and state.pending_file == printer.virtual_sdcard.file_path and printer.pause_resume.is_paused and printer.print_stats.state == 'paused' %}
    CANCEL_PRINT PARK=0
  {% else %}
    RESPOND TYPE=error MSG="Reject ignored: no matching paused final check"
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel reliably; final rejection and error cancellation never move
rename_existing: CANCEL_PRINT_BASE
gcode:
  {% set pending = printer['gcode_macro _PRINT_STATE_500'].postprint_pending %}
  {% set active = printer.print_stats.state in ['printing', 'paused'] and printer.virtual_sdcard.file_path %}
  TURN_OFF_HEATERS
  M106 S0
  SET_FILAMENT_SENSOR SENSOR=filament_movement ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=filament_present ENABLE=0
  CANCEL_PRINT_BASE
  RESPOND TYPE=command MSG="action:prompt_end"
  _RESET_RECOVERY_500
  LED_error
  {% if active and not pending and params.PARK|default(1)|int == 1 %}
    _PARK_500 DZ=100 PARK_XY=0
    M400
    M84
  {% endif %}

[gcode_macro _RESET_RECOVERY_500]
gcode:
  {% set recovery = printer['gcode_macro RESUME'] %}
  {% if recovery.restore_idle_timeout|float > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={recovery.restore_idle_timeout}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': False, 'temp': 0}}"
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_bed_temp VALUE=0
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE=0
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_cooldown_ack VALUE=False
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_file VALUE='""'
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_retracted VALUE=False
  {% if params.CLEAR_END|default(1)|int == 1 %}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE_500 VARIABLE=postprint_pending VALUE=False
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE_500 VARIABLE=pending_file VALUE='""'
  {% endif %}
  {% if params.LAYERS|default(1)|int == 1 %}
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  {% endif %}

[gcode_macro _PARK_500]
description: CoreXY clearance first, with bounded Z travel and explicit speeds
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
  {% set axes = printer.toolhead.homed_axes %}
  {% set xy = params.PARK_XY|default(1)|int == 1 %}
  {% set pos = printer.gcode_move.position %}
  {% set gc = printer.gcode_move.gcode_position %}
  {% set minimum = printer.toolhead.axis_minimum %}
  {% set maximum = printer.toolhead.axis_maximum %}
  {% set dz = params.DZ|default(client.custom_park_dz)|float(-1) %}
  {% set z_min = params.Z_MIN|default(0)|float(-9999) %}
  {% set x = params.X|default(client.custom_park_x)|float(-9999) %}
  {% set y = params.Y|default(client.custom_park_y)|float(-9999) %}
  {% set ox = pos.x - gc.x %}
  {% set oy = pos.y - gc.y %}
  {% set oz = pos.z - gc.z %}
  {% set z_ceiling = maximum.z - 0.5 %}
  {% set target = [[pos.z + dz, z_min + oz]|max, z_ceiling]|min %}
  {% set clear = [target, pos.z + client.custom_park_dz|float]|min %}
  {% if 'z' not in axes or (xy and 'xyz' not in axes) %}
    RESPOND TYPE=echo MSG="Park skipped: required axes are not homed"
  {% elif not (0 <= dz <= maximum.z - minimum.z) or not (-9998 < z_min < 9998) %}
    RESPOND TYPE=error MSG="Park skipped: invalid clearance parameter"
  {% elif not (minimum.z <= pos.z <= maximum.z) %}
    RESPOND TYPE=error MSG="Park skipped: Z position is outside travel limits"
  {% elif xy and not (minimum.x <= x + ox <= maximum.x and minimum.y <= y + oy <= maximum.y) %}
    RESPOND TYPE=error MSG="Park skipped: XY destination is outside travel limits"
  {% else %}
    SAVE_GCODE_STATE NAME=PARK_500_STATE
    G90
    {% if clear > pos.z %} G1 Z{clear - oz} F{client.speed_hop|float * 60} {% endif %}
    {% if xy %}
      {% if clear - pos.z >= client.custom_park_dz|float - 0.001 %}
        G1 X{x} Y{y} F{client.speed_move|float * 60}
      {% else %}
        RESPOND TYPE=echo MSG="XY park skipped: insufficient Z clearance near the upper limit"
      {% endif %}
    {% endif %}
    {% if target > clear and target > pos.z %} G1 Z{target - oz} F{client.speed_hop|float * 60} {% endif %}
    RESTORE_GCODE_STATE NAME=PARK_500_STATE
  {% endif %}

[gcode_macro PURGE_BLOB]
description: Bounded startup purge; LENGTH=140 SPEED=15 defaults (mm and mm/s)
gcode:
  {% set pos = printer.gcode_move.position %}
  {% set gc = printer.gcode_move.gcode_position %}
  {% set minimum = printer.toolhead.axis_minimum %}
  {% set maximum = printer.toolhead.axis_maximum %}
  {% set ox = pos.x - gc.x %}
  {% set oy = pos.y - gc.y %}
  {% set oz = pos.z - gc.z %}
  {% set fan = printer.fan.speed %}
  {% set length = params.LENGTH|default(140)|float(-1) %}
  {% set speed = params.SPEED|default(15)|float(-1) %}
  {% if printer.pause_resume.is_paused or printer['gcode_macro _PRINT_STATE_500'].postprint_pending %}
    {action_raise_error("PURGE_BLOB is for startup on a clear bed; it cannot run during a pause")}
  {% elif 'xyz' not in printer.toolhead.homed_axes or not printer.extruder.can_extrude %}
    {action_raise_error("Home the printer and heat the nozzle before purging")}
  {% elif not printer['filament_switch_sensor filament_present'].filament_detected %}
    {action_raise_error("No filament detected before purge")}
  {% elif not (0 < length <= 140 and 0 < speed <= 15) %}
    {action_raise_error("Purge requires LENGTH in (0,140] mm and SPEED in (0,15] mm/s")}
  {% elif not (minimum.x <= 20 + ox and 80 + ox <= maximum.x and minimum.y <= 20 + oy and 80 + oy <= maximum.y and minimum.z <= 5 + oz and 8 + oz <= maximum.z) %}
    {action_raise_error("Purge path is outside travel limits")}
  {% else %}
    SAVE_GCODE_STATE NAME=PURGE_BLOB_STATE
    G90
    M83
    M221 S100
    # Raise before XY travel; never descend as part of a diagonal approach.
    G1 Z{[gc.z, 8]|max} F900
    G1 X20 Y20 F18000
    G1 Z5 F600
    G1 E{length} F{speed * 60}
    M106 S255
    G1 E15 F450
    G1 E-2 F3000
    G1 X80 Y80 F18000
    M106 S{fan * 255}
    RESTORE_GCODE_STATE NAME=PURGE_BLOB_STATE
  {% endif %}

[gcode_macro PRIME_FILAMENT]
description: Optional manual prime after a filament change; example PRIME_FILAMENT LENGTH=50
gcode:
  {% set recovery = printer['gcode_macro RESUME'] %}
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
  {% set gc = printer.gcode_move.gcode_position %}
  {% set length = params.LENGTH|default(50)|float(-1) %}
  {% set speed = params.SPEED|default(5)|float(-1) %}
  {% if printer['gcode_macro _PRINT_STATE_500'].postprint_pending or not printer.pause_resume.is_paused or not recovery.pause_file or recovery.pause_file != printer.virtual_sdcard.file_path or printer.print_stats.state != 'paused' %}
    {action_raise_error("PRIME_FILAMENT requires an ordinary printing pause")}
  {% elif 'xyz' not in printer.toolhead.homed_axes or not printer.extruder.can_extrude or not printer['filament_switch_sensor filament_present'].filament_detected %}
    {action_raise_error("Home position, hot nozzle and loaded filament are required for priming")}
  {% elif (gc.x - client.custom_park_x)|abs > 0.5 or (gc.y - client.custom_park_y)|abs > 0.5 %}
    {action_raise_error("Prime only at the configured park position, with space to collect the filament")}
  {% elif not (0 < length <= 140 and 0 < speed <= 20) %}
    {action_raise_error("Prime requires LENGTH in (0,140] mm and SPEED in (0,20] mm/s")}
  {% else %}
    SAVE_GCODE_STATE NAME=PRIME_FILAMENT_STATE
    M83
    M221 S100
    G1 E{length} F{speed * 60}
    RESTORE_GCODE_STATE NAME=PRIME_FILAMENT_STATE
  {% endif %}

[gcode_macro LED_printing]
gcode:
  SET_LED LED=my_led RED=0.2 GREEN=0.3 BLUE=0.2 SYNC=0 TRANSMIT=1

[gcode_macro LED_print_done]
gcode:
  SET_LED LED=my_led RED=0 GREEN=0.2 BLUE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_idle]
gcode:
  SET_LED LED=my_led RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_error]
gcode:
  SET_LED LED=my_led RED=0.2 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_pause]
gcode:
  SET_LED LED=my_led RED=0.2 GREEN=0.1 BLUE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_runout]
description: Four flashes followed by steady illumination; original colors retained
gcode:
  {% for pulse in range(4) %}
    SET_LED LED=my_led RED=0 GREEN=0 BLUE=0 SYNC=1 TRANSMIT=1
    G4 P250
    SET_LED LED=my_led RED=0.2 GREEN=0.1 BLUE=0 SYNC=1 TRANSMIT=1
    G4 P250
  {% endfor %}
  SET_LED LED=my_led RED=0 GREEN=0 BLUE=0 SYNC=1 TRANSMIT=1
  G4 P250
  SET_LED LED=my_led RED=0.2 GREEN=0.1 BLUE=0 SYNC=1 TRANSMIT=1
  M400

[gcode_macro TEST_SPEED]
# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

description: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU

gcode:
    # Speed
    {% set speed  = params.SPEED|default(200)|float(-1) %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(2)|int(-1) %}
    # Acceleration
    {% set accel  = params.ACCEL|default(2000)|float(-1) %}
    # Minimum Cruise Ratio
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box
    {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|float(-1) %}
    
    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x + bound %}
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = printer.toolhead.axis_minimum.y + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
        
        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    {% if printer.print_stats.state in ['printing', 'paused'] or printer.pause_resume.is_paused or printer['gcode_macro _PRINT_STATE_500'].postprint_pending %}
      {action_raise_error("TEST_SPEED requires an idle printer and a clear bed")}
    {% elif not (0 < speed <= printer.configfile.settings.printer.max_velocity and 0 < accel <= printer.configfile.settings.printer.max_accel and 1 <= iterations <= 20 and 0 <= min_cruise_ratio < 1) %}
      {action_raise_error("TEST_SPEED parameters exceed configured limits or valid ranges")}
    {% elif not (10 <= bound <= 100 and 0 < smallpatternsize < [x_max-x_min, y_max-y_min]|min) %}
      {action_raise_error("Use BOUND=10..100 and a positive SMALLPATTERNSIZE within the inset")}
    {% endif %}
    {% set previous = printer.toolhead %}
    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    M220 S100
    BED_MESH_CLEAR # The next PRINT_START creates a fresh mesh.
    
    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %.1f, accel %.1f" % (iterations, speed, accel)) }
    
    # Home and get position for comparison later:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28
        # QGL if not already QGLd (only if QGL section exists in config)
        {% if printer.configfile.settings.quad_gantry_level %}
            {% if printer.quad_gantry_level.applied == False %}
                QUAD_GANTRY_LEVEL
                G28 Z
            {% endif %}
        {% endif %} 
        # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
        G90
        G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Go to starting position
    G0 Z{bound + 10} F900
    G0 X{x_min} Y{y_min} F{speed*60}

    # Set new limits
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        
        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
    
        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        
        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/accel_to_decel to their configured values
    SET_VELOCITY_LIMIT VELOCITY={previous.max_velocity} ACCEL={previous.max_accel} MINIMUM_CRUISE_RATIO={previous.minimum_cruise_ratio}

    # Re-home and get position again for comparison:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
        # Go to XY home positions (in case your homing override leaves it elsewhere)
        G90
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED
