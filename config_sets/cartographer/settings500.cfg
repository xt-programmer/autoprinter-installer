## Settings 500P  ##
## Version:  6.5  ##
## 28-10-2026 AB  ##

[gcode_arcs]
resolution: 0.5

[exclude_object]

[pause_resume]
recover_velocity: 50.0

[respond]

[display_status]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT PARK=0

[force_move]
enable_force_move: True

[idle_timeout]
timeout: 43200
gcode:
    TURN_OFF_HEATERS
    {% if printer.pause_resume.is_paused %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=True
    {% endif %}

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 6200
max_z_velocity: 15
max_z_accel: 50
square_corner_velocity: 4
minimum_cruise_ratio: 0.5

[stepper_x]
microsteps: 16
position_endstop: 0
position_min: -1
position_max: 500
homing_speed: 100
second_homing_speed: 25

[stepper_y]
microsteps: 16
position_endstop: 0
position_min: -1
position_max: 500
homing_speed: 90
second_homing_speed: 25

[stepper_x1]
microsteps: 16

[stepper_y1]
microsteps: 16

[stepper_z]
microsteps: 32
position_max: 1150
position_min: -10
homing_speed: 5

[stepper_z1]
microsteps: 32

[safe_z_home]
home_xy_position: 267, 240
speed: 150
z_hop: 20
z_hop_speed: 15

[extruder]
nozzle_diameter: 1.0
max_extrude_cross_section: 4.0

microsteps: 16
filament_diameter: 1.750
max_extrude_only_distance: 1500.0
max_extrude_only_velocity: 50
max_extrude_only_accel: 1000
min_extrude_temp: 170
min_temp: 5
max_temp: 350
smooth_time: 1.0

pressure_advance: 0
pressure_advance_smooth_time: 0.040

[heater_bed]
min_temp: 10
max_temp: 110

[filament_motion_sensor filament_movement]
pause_on_runout: True
runout_gcode:
    LED_runout
extruder: extruder
event_delay: 5.0
pause_delay: 1.0
detection_length: 26

[filament_switch_sensor filament_present]
pause_on_runout: True
runout_gcode:
    LED_runout

[fan]
kick_start_time: 0.5

[temperature_sensor Octopus]
sensor_type: temperature_mcu
min_temp: 10
max_temp: 85

[temperature_sensor Pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 95

[led my_led]
initial_RED: 0.2
initial_GREEN: 0.3
initial_BLUE: 0.2

[tmc5160 stepper_x]
interpolate: False
run_current: 1.75
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_x1]
interpolate: False
run_current: 1.75
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_y]
interpolate: False
run_current: 1.75
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_y1]
interpolate: False
run_current: 1.75
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z]
interpolate: False
run_current: 1.5
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z1]
interpolate: False
run_current: 1.5
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 extruder]
interpolate: False
run_current: 1
sense_resistor: 0.075
stealthchop_threshold: 0

[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 86.0
shaper_type_y = mzv
shaper_freq_y = 49.6

[z_tilt]
z_positions:
    -67.5, 250
    567.5, 250

points:
    75, 219.116
    425, 219.116

speed: 300
horizontal_move_z: 3
retries: 5
retry_tolerance: 0.02
